# Vibe hooks (https://docs.mistral.ai/vibe/code/overview)
# Loaded from this trusted project folder. Reload after edits: /reload

# Pre-tool gate: never let the agent hand-edit the Kiota-generated Client projects.
[[hooks]]
name = "protect-generated-clients"
type = "pre_tool"
match = "re:(edit|write_file)"
command = "powershell -NoProfile -ExecutionPolicy Bypass -File .vibe/hooks/protect-generated-clients.ps1"
description = "Deny edits to src/backend/*/Client (Kiota-generated)"

